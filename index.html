<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>一般常識クイズ</h1>

    <!-- スタート画面 -->
    <section id="start-screen" class="screen">
      <p class="lead">全10問の4択クイズです。<br>あなたの一般常識をチェックしましょう！</p>
      <button id="start-btn" class="btn btn-primary">スタート</button>
    </section>

    <!-- 問題画面 -->
    <section id="quiz-screen" class="screen hidden">
      <p id="progress" class="progress"></p>
      <h2 id="question" class="question"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="btn btn-primary hidden">次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="screen hidden">
      <h2>結果</h2>
      <p id="score" class="score"></p>
      <p id="message" class="message"></p>
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
